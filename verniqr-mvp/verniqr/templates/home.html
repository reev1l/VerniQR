<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ВерниQR — связь с владельцем вещи</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="card"><p class="brand">ВерниQR</p><h1>Помогите вещи вернуться домой</h1><p>Владелец создаёт метку в Telegram и прикрепляет её к вещи. Нашедший сканирует QR и отправляет сообщение без регистрации.</p>{% if bot_username %}<a class="button" href="https://t.me/{{ bot_username }}">Открыть бота</a>{% endif %}<a class="secondary" href="/demo">Посмотреть пример страницы</a><p class="note">Для связи по найденной вещи отсканируйте QR на её метке.</p></main></body>
</html>
