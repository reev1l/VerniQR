[project]
name = "verniqr"
version = "0.1.0"
description = "QR labels and found-item reports in Telegram"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.20,<4",
  "aiohttp-socks>=0.10,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "qrcode[pil]>=8,<9",
  "reportlab>=4.2,<5",
  "pydantic-settings>=2.5,<3",
  "jinja2>=3.1,<4",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.11,<1", "pypdf>=5,<7", "zxing-cpp>=2.2,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verniqr*"]

[tool.setuptools.package-data]
verniqr = ["templates/*.html", "static/*", "fonts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
